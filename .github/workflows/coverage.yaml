name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage
      - name: Measure coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(quiet = FALSE)
          percent <- as.numeric(covr::percent_coverage(coverage))
          writeLines(sprintf("%.2f%%", percent), "coverage.txt")
          saveRDS(coverage, "coverage.rds")
          if (percent < 85) stop(sprintf("Coverage %.2f%% is below 85%%.", percent))
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.txt
            coverage.rds
          retention-days: 30
